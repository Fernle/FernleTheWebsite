<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Portfolio Homepage</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Noto+Sans:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5b13ec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#0f0a18",
                        "surface-dark": "#181226",
                        "border-dark": "#2e2839",
                        "text-secondary": "#a69db9",
                        "neon-purple": "#8b5cf6",
                        "neon-pink": "#ec4899",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"],
                    },
                    backgroundImage: {
                        'grid-pattern': "url(\"data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40' stroke='rgba(91, 19, 236, 0.05)' stroke-width='2'/%3E%3C/g%3E%3C/svg%3E\")",
                        'dot-pattern': "url(\"data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='1' height='1' x='1' y='1' fill='rgba(139, 92, 246, 0.15)'/%3E%3C/svg%3E\")",
                    }
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
        .text-glow {
            text-shadow: 0 0 10px rgba(91, 19, 236, 0.5);
        }
        .box-glow {
            box-shadow: 0 0 20px rgba(91, 19, 236, 0.15);
        }
        .neon-gradient-text {
            @apply bg-clip-text text-transparent bg-gradient-to-r from-neon-purple via-neon-pink to-neon-purple;
            background-size: 200% auto;
            animation: gradient-flow 5s linear infinite;
        }
        @keyframes gradient-flow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .moving-glow {
            animation: glow-pulse 4s ease-in-out infinite alternate;
        }
        @keyframes glow-pulse {
            0% { transform: scale(1) rotate(0deg); opacity: 0.4; filter: blur(20px); }
            100% { transform: scale(1.1) rotate(8deg); opacity: 0.7; filter: blur(40px); }
        }
        .btn-universal {
            @apply flex h-14 w-full sm:w-auto items-center justify-center gap-3 rounded-lg border border-gray-200 dark:border-white/10 bg-white dark:bg-surface-dark px-8 text-base font-bold text-gray-900 dark:text-white transition-all duration-300;
        }
        .btn-universal:hover {
            @apply bg-primary border-primary text-white scale-[1.02];
            box-shadow: 0 0 25px rgba(91, 19, 236, 0.5);
        }
        html {
            scroll-behavior: smooth;
        }
    }
</style>
</head>

<body class="font-display">
    <div
        class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark dark:bg-dot-pattern group/design-root overflow-x-hidden">
        <header class="w-full border-b border-[#2e2839] bg-background-dark/95 backdrop-blur-sm sticky top-0 z-50">
            <div class="w-full px-6 md:px-12 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3 text-white">
                    <div class="text-primary flex items-center">
                        <span class="material-symbols-outlined !text-[28px]">rocket_launch</span>
                    </div>
                    <h2
                        class="text-white text-xl font-bold tracking-tighter transition-all hover:text-primary cursor-default">
                        Portfolio
                    </h2>
                </div>

                <nav class="flex items-center gap-6 md:gap-10">
                    <a class="text-gray-400 hover:text-white text-sm font-medium transition-colors"

                    <a class="text-gray-400 hover:text-white text-sm font-medium transition-colors"

            </div>
        </header>
        <div class="flex flex-1 flex-col">
            <section id="welcome-section"
                class="relative w-full overflow-hidden h-[calc(100vh-73px)] min-h-[calc(100vh-73px)] flex flex-col items-center justify-center text-center px-4 py-6">
                <div
                    class="absolute top-0 right-0 -z-10 h-[600px] w-[600px] bg-primary/40 opacity-40 blur-[130px] rounded-full translate-x-1/3 -translate-y-1/4 pointer-events-none mix-blend-screen">
                </div>

                </div>
                <div
                    class="absolute top-1/2 left-1/2 -z-10 h-[400px] w-[400px] bg-cyan-500/20 opacity-30 blur-[100px] rounded-full -translate-x-1/2 -translate-y-1/2 pointer-events-none mix-blend-screen">

                    <h1

    <script>
        // Orbital Carousel Data
        const orbitalData = [
            {
                id: "education",
                label: "Education",
                icon: "school",
                badge: "Academic Degree",
                title: "Istanbul Bilgi University",
                subtitle: "BACHELOR of SCIENCE in DIGITAL GAME DESIGN (2021 – 2025)",
                desc: "Focused on software development, C# architecture, SOLID design principles, and game engine mechanics."
            },
            {
                id: "gamer",
                label: "The Gamer Page",
                icon: "sports_esports",
                badge: "Gaming Library",
                title: "The Gamer Hub",
                subtitle: "Curated Game Collection",
                desc: "A dedicated space exploring digital worlds I've played, rated, and evaluated with detailed evaluation scores."
            },
            {
                id: "developer",
                label: "The Developer Page",
                icon: "code",
                badge: "Engineering & Architecture",
                title: "The Developer Hub",
                subtitle: "Projects & Production Workflows",
                desc: "Showcase of Unity projects, game mechanics, C# code samples, production pipeline optimizations, and team management."
            },
            {
                id: "contact",
                label: "Contact",
                icon: "mail",
                badge: "Get In Touch",
                title: "Contact & Socials",
                subtitle: "Direct Contact & Profiles",
                desc: ""
            },
            {
                id: "stats",
                label: "Stats",
                icon: "analytics",
                badge: "Real-Time Metrics",
                title: "Portfolio Statistics",
                subtitle: "Projects & Games Overview",
                desc: ""
            }
        ];

        let orbitAngle = 0;
        let isOrbitHovered = false;
        let activeCardIndex = null;
        let socialsData = [];
        let statsData = { games: 0, projects: 0 };

        function copyEmail(btn) {
            const email = "ahmetemirozde@gmail.com";
            navigator.clipboard.writeText(email).then(() => {
                const iconEl = btn.querySelector('.copy-icon');
                const textEl = btn.querySelector('.copy-text');
                if (iconEl) iconEl.innerText = 'check';
                if (textEl) textEl.innerText = 'Copied!';
                btn.classList.add('bg-green-500/20', 'text-green-400', 'border-green-500/40');
                btn.classList.remove('bg-primary/30', 'text-white', 'border-primary/50');
                setTimeout(() => {
                    if (iconEl) iconEl.innerText = 'content_copy';
                    if (textEl) textEl.innerText = 'Copy';
                    btn.classList.remove('bg-green-500/20', 'text-green-400', 'border-green-500/40');
                    btn.classList.add('bg-primary/30', 'text-white', 'border-primary/50');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        function openInfoCard(index, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            const data = orbitalData[index];
            const wrapper = document.getElementById('orbital-wrapper');
            const nodeEl = document.getElementById(`orbit-node-${index}`);
            if (!data || !wrapper || !nodeEl) return;

            const wrapperRect = wrapper.getBoundingClientRect();
            const nodeRect = nodeEl.getBoundingClientRect();

            // Check if node is left or right of center
            const nodeCenterX = nodeRect.left + nodeRect.width / 2;
            const wrapperCenterX = wrapperRect.left + wrapperRect.width / 2;
            const isLeft = nodeCenterX < wrapperCenterX;

            const targetSide = isLeft ? 'left' : 'right';
            const oppositeSide = isLeft ? 'right' : 'left';

            const targetCard = document.getElementById(`info-card-${targetSide}`);
            const oppositeCard = document.getElementById(`info-card-${oppositeSide}`);

            if (oppositeCard) {
                oppositeCard.classList.add('opacity-0', 'pointer-events-none', isLeft ? 'translate-x-6' : '-translate-x-6');
                oppositeCard.classList.remove('opacity-100', 'translate-x-0', 'pointer-events-auto');
            }

            if (targetCard) {
                if (data.id === 'contact') {
                    const socialsHtml = socialsData.length > 0
                        ? socialsData.map(s => {
                            let colorClass = s.color_class || 'text-white';
                            if (colorClass.includes('gray-800') || colorClass.includes('gray-900') || colorClass.includes('black')) {
                                colorClass = 'text-gray-400';
                            }
                            return `
                            <a href="${s.url}" target="_blank" class="flex items-center justify-between p-2.5 rounded-xl bg-white/5 border border-white/10 hover:border-primary/50 hover:bg-white/10 transition-all group">
                                <div class="flex items-center gap-3">
                                    <div class="flex size-8 items-center justify-center rounded-lg bg-white/5 ${colorClass}">
                                        <span class="material-symbols-outlined text-base">${s.icon || 'link'}</span>
                                    </div>
                                    <span class="text-xs font-bold text-white group-hover:text-primary transition-colors">${s.platform}</span>
                                </div>
                                <span class="material-symbols-outlined text-sm text-gray-400 group-hover:text-white transition-colors">arrow_outward</span>
                            </a>`;
                        }).join('')
                        : '<p class="text-xs text-gray-400 italic">No social links available.</p>';

                    targetCard.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <span class="px-3 py-1 rounded-full bg-neon-purple/20 border border-neon-purple/40 text-xs font-bold text-neon-purple shadow-[0_0_10px_rgba(139,92,246,0.25)]">${data.badge}</span>
                        <button onclick="closeInfoCards()" class="text-gray-400 hover:text-white transition-colors p-1">
                            <span class="material-symbols-outlined text-lg">close</span>
                        </button>
                    </div>
                    <h3 class="text-xl font-black text-white tracking-tight">${data.title}</h3>
                    <p class="text-xs font-semibold text-neon-purple mt-1 mb-4">${data.subtitle}</p>

                    <div class="mb-4 p-3 rounded-xl bg-white/5 border border-white/10 flex flex-col gap-2">
                        <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Email Address</span>
                        <div class="flex items-center justify-between gap-2 bg-background-dark/80 p-2.5 rounded-lg border border-white/5">
                            <span class="text-xs font-medium text-white truncate select-all">ahmetemirozde@gmail.com</span>
                            <button onclick="copyEmail(this)" class="flex items-center gap-1 px-2.5 py-1 text-xs font-bold rounded-md bg-primary/30 hover:bg-primary text-white border border-primary/50 transition-all cursor-pointer shrink-0">
                                <span class="material-symbols-outlined text-sm copy-icon">content_copy</span>
                                <span class="copy-text">Copy</span>
                            </button>
                        </div>
                    </div>

                    <div class="flex flex-col gap-2">
                        <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Social Profiles</span>
                        ${socialsHtml}
                    </div>
                    `;
                } else if (data.id === 'stats') {
                    targetCard.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <span class="px-3 py-1 rounded-full bg-neon-purple/20 border border-neon-purple/40 text-xs font-bold text-neon-purple shadow-[0_0_10px_rgba(139,92,246,0.25)]">${data.badge}</span>
                        <button onclick="closeInfoCards()" class="text-gray-400 hover:text-white transition-colors p-1">
                            <span class="material-symbols-outlined text-lg">close</span>
                        </button>
                    </div>
                    <h3 class="text-xl font-black text-white tracking-tight">${data.title}</h3>
                    <p class="text-xs font-semibold text-neon-purple mt-1 mb-4">${data.subtitle}</p>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="p-4 rounded-xl bg-white/5 border border-white/10 flex flex-col items-center justify-center text-center group hover:border-primary/50 transition-all">
                            <span class="material-symbols-outlined text-primary text-3xl mb-1">terminal</span>
                            <span class="text-2xl font-black text-white">${statsData.projects}</span>
                            <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mt-1">Projects</span>
                        </div>
                        <div class="p-4 rounded-xl bg-white/5 border border-white/10 flex flex-col items-center justify-center text-center group hover:border-neon-pink/50 transition-all">
                            <span class="material-symbols-outlined text-neon-pink text-3xl mb-1">sports_esports</span>
                            <span class="text-2xl font-black text-white">${statsData.games}</span>
                            <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mt-1">Games Played</span>
                        </div>
                    </div>
                    `;
                } else {
                    targetCard.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <span class="px-3 py-1 rounded-full bg-neon-purple/20 border border-neon-purple/40 text-xs font-bold text-neon-purple shadow-[0_0_10px_rgba(139,92,246,0.25)]">${data.badge}</span>
                        <button onclick="closeInfoCards()" class="text-gray-400 hover:text-white transition-colors p-1">
                            <span class="material-symbols-outlined text-lg">close</span>
                        </button>
                    </div>
                    <h3 class="text-xl font-black text-white tracking-tight">${data.title}</h3>
                    <p class="text-xs font-semibold text-neon-purple mt-1 mb-3">${data.subtitle}</p>
                    <p class="text-xs sm:text-sm text-gray-300 leading-relaxed">${data.desc}</p>
                `;
                }

                targetCard.classList.remove('opacity-0', 'pointer-events-none', isLeft ? '-translate-x-6' : 'translate-x-6');
                targetCard.classList.add('opacity-100', 'translate-x-0', 'pointer-events-auto');
            }

            activeCardIndex = index;
        }

        function closeInfoCards() {
            ['left', 'right'].forEach(side => {
                const card = document.getElementById(`info-card-${side}`);
                if (card) {
                    card.classList.add('opacity-0', 'pointer-events-none', side === 'left' ? '-translate-x-6' : 'translate-x-6');
                    card.classList.remove('opacity-100', 'translate-x-0', 'pointer-events-auto');
                }
            });
            activeCardIndex = null;
        }

        function initOrbitalSystem() {
            const container = document.getElementById('orbital-nodes-container');
            const svg = document.getElementById('orbital-svg');
            const wrapper = document.getElementById('orbital-wrapper');
            if (!container || !svg || !wrapper) return;

            container.innerHTML = '';
            svg.innerHTML = '';

            const total = orbitalData.length;

            orbitalData.forEach((data, index) => {
                // SVG Line
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('stroke', 'rgba(91, 19, 236, 0.35)');
                line.setAttribute('stroke-width', '1.5');
                line.setAttribute('stroke-dasharray', '4 4');
                line.id = `orbit-line-${index}`;
                svg.appendChild(line);

                // Node Element
                const nodeEl = document.createElement('div');
                nodeEl.className = 'absolute pointer-events-auto cursor-pointer transition-shadow duration-300 hover:scale-125 hover:z-40';
                nodeEl.id = `orbit-node-${index}`;

                const pulsePeriod = 4.5 + (index * 1.2) % 3.5;
                const pulsePhase = (index * 1.4) % (Math.PI * 2);

                nodeEl.setAttribute('data-pulse-period', pulsePeriod);
                nodeEl.setAttribute('data-pulse-phase', pulsePhase);
                nodeEl.setAttribute('data-base-angle', (index * 2 * Math.PI) / total);

                nodeEl.innerHTML = `
                <div onclick="openInfoCard(${index}, event)" class="flex flex-col items-center group">
                    <div class="size-11 sm:size-14 md:size-16 rounded-full bg-surface-dark border border-white/20 dark:border-primary/40 shadow-lg flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white group-hover:border-primary transition-all duration-300 group-hover:shadow-[0_0_25px_rgba(91,19,236,0.7)]">
                        <span class="material-symbols-outlined text-lg sm:text-2xl md:text-2xl">${data.icon}</span>
                    </div>
                    <div class="mt-1.5 px-2.5 py-1 rounded-full bg-surface-dark/95 border border-white/10 text-[10px] sm:text-xs font-bold text-white whitespace-nowrap shadow-md group-hover:border-primary group-hover:text-primary transition-all">
                        ${data.label}
                    </div>
                </div>
            `;

                nodeEl.addEventListener('mouseenter', () => { isOrbitHovered = true; });
                nodeEl.addEventListener('mouseleave', () => { isOrbitHovered = false; });

                container.appendChild(nodeEl);
            });

            let lastTime = performance.now();
            let virtualPulseTime = 0;

            function animateOrbit(time) {
                const delta = (time - lastTime) / 1000;
                lastTime = time;

                if (!isOrbitHovered && activeCardIndex === null) {
                    orbitAngle += delta * 0.10; // Normal smooth 60fps rotation
                    virtualPulseTime += delta * 1.0; // Normal breathing speed
                } else if (isOrbitHovered && activeCardIndex === null) {
                    virtualPulseTime += delta * 0.2; // Hovered gentle float
                }
                // When activeCardIndex !== null (card open): freezes in place without subpixel jitter!

                const rect = wrapper.getBoundingClientRect();
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const baseRadius = rect.width * 0.38;

                orbitalData.forEach((_, index) => {
                    const nodeEl = document.getElementById(`orbit-node-${index}`);
                    const line = document.getElementById(`orbit-line-${index}`);
                    if (!nodeEl || !line) return;

                    const baseAngle = parseFloat(nodeEl.getAttribute('data-base-angle'));
                    const pulsePeriod = parseFloat(nodeEl.getAttribute('data-pulse-period'));
                    const pulsePhase = parseFloat(nodeEl.getAttribute('data-pulse-phase'));

                    const currentAngle = baseAngle + orbitAngle;

                    // Ultra-slow breathing pulse when card is active
                    const pulseOffset = Math.sin(virtualPulseTime * (2 * Math.PI / pulsePeriod) + pulsePhase) * (rect.width * 0.025);
                    const currentRadius = baseRadius + pulseOffset;

                    const x = centerX + Math.cos(currentAngle) * currentRadius;
                    const y = centerY + Math.sin(currentAngle) * currentRadius;

                    nodeEl.style.left = `${x}px`;
                    nodeEl.style.top = `${y}px`;
                    nodeEl.style.transform = `translate(-50%, -50%)`;

                    line.setAttribute('x1', centerX);
                    line.setAttribute('y1', centerY);
                    line.setAttribute('x2', x);
                    line.setAttribute('y2', y);
                });

                requestAnimationFrame(animateOrbit);
            }

            requestAnimationFrame(animateOrbit);
        }

        function handleScrollIndicator() {
            const el = document.getElementById('scroll-indicator');
            if (!el) return;
            if (window.scrollY > 30) {
                el.classList.add('opacity-0', 'translate-y-4');
                el.classList.remove('opacity-70');
            } else {
                el.classList.remove('opacity-0', 'translate-y-4');
                el.classList.add('opacity-70');
            }
        }

            if (e.deltaY > 10 && window.scrollY < 100) {
                lastWheelTime = now;
                orbital.scrollIntoView({ behavior: 'smooth' });
